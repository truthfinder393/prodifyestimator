g and greywater recycling for landscaping."},{id:"in-mountain-cold",location:"India",name:"Mountainous & Cold (Himalayan Zone)",description:"Cold alpine conditions with freezing winters, intense snowloads, and landslide risks (e.g., Ladakh, Himachal Pradesh, Uttarakhand).",soilRecommendation:"Rocky, silty, or thin acidic mountain soils. High risk of soil erosion. Focus on retaining walls, terraced slopes, and deep structural rooting.",greenDesignHint:"Incorporate active/passive solar greenhouses on southern façades, maximize south-facing insulated triple glazing, and use lightweight energy-efficient timber/hybrid framing."},{id:"uae-coastal-urban",location:"UAE",name:"Hot Coastal Urban Zone (Dubai, Abu Dhabi, Sharjah)",description:"Intense heat combined with very high relative humidity from the Arabian Gulf. High salinity levels, strong urban heat island effect, and persistent maritime breeze.",soilRecommendation:"Highly saline Sandy soils. Concrete requires high sulfate-resisting cement. Direct coastal landscaping must employ halophytic, salt-tolerant native groundcover.",greenDesignHint:"Use ultra-reflective exterior coatings (high solar reflectance index SRIs), highly efficient thermal break fenestration, and complex HVAC recovery wheels."},{id:"uae-arid-inland",location:"UAE",name:"Hyper-Arid Inland Desert (Al Ain, Desert Interior)",description:"Extremely high daytime temperatures (often exceeding 48°C), dry air currents, low nocturnal temperatures, and sand drift dynamics.",soilRecommendation:"Sandy soil with high permeability and close to zero natural nutrient organic matter. Drip irrigation lines must be buried deeper of wind drift.",greenDesignHint:"Orient layouts to minimize wind-swept sand infiltration, install perimeter windbreak tree lines, utilize radiant hydronic floor cooling, and harness intensive PV arrays."},{id:"uae-mountain-hatta",location:"UAE",name:"Rugged Mountainous Foothills (Hatta, Fujairah)",description:"Stony, barren mountainous terrain with higher temperature amplitude, gravel bed wadis, and sudden flash flood risks.",soilRecommendation:"Rocky / hard gravel soils. Highly challenging for excavation. Foundations require anchoring; landscaping thrives in microclimatic wadi-bed soils.",greenDesignHint:"Integrate localized stone-masonry gabion structures to harvest flash wadi run-offs, leverage passive mountain-wind drafting, and specify local stone cladding."},{id:"eu-central-oceanic",location:"Europe",name:"Central European Oceanic Zone (Frankfurt, Paris, Brussels)",description:"Temperate, mildly humid maritime air masses. Moderate summers and cool, wet winters. Consistent annual rain patterns. Main building target is winter heat preservation and passive solar gain.",soilRecommendation:"Loamy and Silty soils are predominant. Highly fertile but requires excellent foundation drainage configurations to avoid damp cellar walls.",greenDesignHint:"Prioritize double-skin facades with thermal glass partitions (low-E coatings, Argon gaps), heat recovery ventilation (HRV >= 85%), and rain harvesting."},{id:"eu-mediterranean",location:"Europe",name:"Southern Euro-Mediterranean Zone (Athens, Rome, Madrid)",description:"Subtropical hot, dry summers paired with mild, wet winters. High solar irradiance index in summers, requiring thermal mass and solar shading controls.",soilRecommendation:"Silty clay loam and Rocky soils. Stony top layers offer high stability; incorporate deep drought-resilient vegetation grids to guard against slope erosions.",greenDesignHint:"Utilize high-albedo clay tile roofing, deep cantilevered balconies, natural cross-ventilation, and greywater recycling for endemic xeriscapes."},{id:"eu-boreal-cold",location:"Europe",name:"Northern Boreal & Baltic Zone (Stockholm, Oslo, Helsinki)",description:"Subarctic continental climate with freezing, dark, snowy winters and brief, mild summers. Heating energy optimization is the primary operational concern.",soilRecommendation:"Rocky bedrock or spongy Peaty soil pockets. Bedrock offers immense load support, but peaty spaces demand deep helical anchoring or complete sand swap backfills.",greenDesignHint:"Use triple-glazed gas-filled wooden window profiles, high-thickness exterior timber insulation (R-values >= 40), and mechanical heat pumps coupled with geothermal storage."},{id:"sg-equatorial-island",location:"Singapore",name:"Equatorial Rainforest / Garden City (Singapore Mainland)",description:"Constant high temperatures and intense relative humidity year-round. Zero cold season. Abundant precipitation with two distinct tropical monsoon wind streams.",soilRecommendation:"Clayey and Silty latosol soils. Dense structures that require deep pile structural basements; requires immediate run-off retention to avoid soil siltation.",greenDesignHint:"Optimize structural shading via vertical green screens and biophilic sky terraces (LEED dynamic cooling effect), collect rainwater for dual flushing, and run high-efficiency smart indoor water chillers."}],gh={Clayey:{text:"Heavy density soil that holds high moisture content but suffers shrink-swell volume changes with seasons.",foundation:"Recommended foundation: Deep piles or under-reamed rafts to anchor deep beyond moisture swings.",color:"amber"},Sandy:{text:"Very loose, gritty texture offering rapid gravity drainage but near-zero structural bonding and organic retention.",foundation:"Recommended foundation: Raft foundations or vibro-flotation soil-strengthening pile compacts.",color:"yellow"},Silty:{text:"Smooth powder grains that hold moderate moisture. High risk of soil liquefaction under intense loads or moisture surges.",foundation:"Recommended foundation: Reinforced strip footings or deep pier anchoring strategies.",color:"orange"},Loamy:{text:"The perfect biological, agricultural blend of compost, sand, and clay. Offers good structural stability and outstanding root health.",foundation:"Recommended foundation: Standard open shallow spread footings (highly cost-eff
