<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodify Green Nexus — Sustainability Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050D08;--bg2:#091409;--card:#0B1C0F;--card2:#0F2215;
  --border:#163020;--border2:#1E4030;
  --em:#0FBF7A;--em2:#0D9960;--gold:#C8970F;--amber:#F59E0B;
  --red:#E84444;--blue:#3B82F6;--cyan:#08B8D4;--purple:#8B5CF6;--rose:#F43F5E;
  --fg:#E4F2E8;--fg2:#B8D4BE;--muted:#5A9470;
  --r1:12px;--r2:10px;--r3:8px;
  --sh:0 4px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ─── ANIMATIONS ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.6)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(15,191,122,.2)}50%{box-shadow:0 0 28px rgba(15,191,122,.55)}}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}

/* ─── GLASSMORPHISM ─── */
.glass{background:rgba(11,28,15,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(22,48,32,.6)}
.glass2{background:rgba(15,34,21,.5);backdrop-filter:blur(10px);border:1px solid rgba(30,64,48,.5)}

/* ─── TOAST ─── */
#toasts{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:9px 14px;border-radius:8px;font-size:11px;color:#fff;animation:slideIn .3s;pointer-events:auto;display:flex;align-items:center;gap:7px;box-shadow:var(--sh);font-weight:600}
.toast.out{animation:fadeOut .3s forwards}

/* ─── SPLASH ─── */
#splash{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash .sc{position:relative;z-index:2;text-align:center}
#splash.hide{animation:fadeOut .8s forwards;pointer-events:none}
.spin-ring{animation:spin 1s linear infinite}
.dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--em);animation:pulse2 2s infinite}
.logo-glow{animation:glow 2.5s infinite}

/* ─── PROGRESS STEPPER ─── */
#stepBar{position:sticky;top:0;z-index:40;background:rgba(5,13,8,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 16px}
.step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid var(--border2);color:var(--muted);background:var(--bg);transition:all .3s;cursor:pointer;flex-shrink:0}
.step-dot.active{border-color:var(--em);color:var(--em);background:rgba(15,191,122,.12);animation:glow 2.5s infinite}
.step-dot.done{border-color:var(--em);color:var(--bg);background:var(--em)}
.step-line{flex:1;height:2px;background:var(--border);transition:background .4s}
.step-line.done{background:var(--em)}

/* ─── FORM INPUTS ─── */
.inp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:8px 11px;font-size:12px;color:var(--fg);outline:none;font-family:'Space Grotesk',sans-serif;transition:border-color .2s}
.inp:focus{border-color:var(--em)}
.sel{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3);padding:8px 8px;font-size:12px;color:var(--fg);outline:none;font-family:'Space Grotesk',sans-serif}
.lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;font-weight:600}

/* ─── BUTTONS ─── */
.btn-primary{padding:9px 20px;border-radius:var(--r3);font-size:12px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--em),var(--em2));color:var(--bg);border:none;font-family:'Space Grotesk',sans-serif;transition:all .15s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(15,191,122,.25)}
.btn-ghost{padding:8px 16px;border-radius:var(--r3);font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--border);font-family:'Space Grotesk',sans-serif;transition:all .15s}
.btn-ghost:hover{border-color:var(--em);color:var(--fg)}

/* ─── QUESTION CARD ─── */
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:11px;margin-bottom:7px;transition:border-color .2s}
.qcard:hover{border-color:var(--border2)}
.opt{padding:5px 11px;border-radius:var(--r3);font-size:10px;cursor:pointer;border:1px solid var(--border);color:var(--muted);display:inline-block;margin:2px;transition:all .12s;font-weight:600}
.opt:hover{border-color:var(--em);color:var(--fg)}
.opt.sel{background:rgba(15,191,122,.15);border-color:var(--em);color:var(--em)}

/* ─── CHECKBOX ─── */
.chk{width:17px;height:17px;border-radius:4px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;flex-shrink:0}
.chk:hover{border-color:var(--em)}
.chk.on{background:var(--em);border-color:var(--em)}

/* ─── PROGRESS BAR ─── */
.pbar{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ─── KPI CARD ─── */
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r1);padding:14px;transition:all .2s;position:relative;overflow:hidden}
.kpi:hover{border-color:rgba(15,191,122,.35);transform:translateY(-1px)}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--em),var(--gold));opacity:0;transition:opacity .2s}
.kpi:hover::after{opacity:1}

/* ─── MODAL ─── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mo.show{display:flex;animation:fadeIn .2s}
.mb{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:460px;width:94%;animation:fadeUp .3s}

/* ─── RISK MATRIX CELL ─── */
.rcell{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;min-height:44px;border:1px solid transparent;transition:all .12s}
.rcell:hover{transform:scale(1.07);z-index:4;box-shadow:0 4px 16px rgba(0,0,0,.5);border-color:rgba(255,255,255,.15)}

/* ─── MAIN CONTENT ─── */
#appWrap{max-width:700px;margin:0 auto;padding:20px 16px 60px}
.scr{animation:fadeUp .3s ease}

/* ─── CERT BADGE ─── */
.cert{display:inline-block;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:.08em}

/* ─── CAT TABS ─── */
.catTab{padding:4px 10px;border-radius:6px;font-size:9px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:all .15s;font-family:'Space Grotesk',sans-serif}
.catTab:hover{background:rgba(15,191,122,.08)}
.catTab.active{background:rgba(15,191,122,.15);color:var(--em);border-color:rgba(15,191,122,.3)}

/* ─── PRINT ─── */
@media print{
  body{background:#fff!important;color:#111!important}
  #splash,#stepBar,#appWrap{display:none!important}
  #printZone{display:block!important}
  #printZone *{color:#111!important;border-color:#ccc!important;background:transparent!important}
  .cv{text-align:center;padding:48px 20px 36px;page-break-after:always}
  .cv h1{font-size:22pt;margin-bottom:6px;color:#0a7d4a!important}
  .cv .sub{font-size:9pt;color:#666!important;margin-bottom:10px}
  .sec{page-break-inside:avoid;margin-bottom:14px;padding:10px;border:1px solid #ddd;border-radius:6px}
  .sec h2{font-size:11pt;border-bottom:2px solid #0a7d4a!important;padding-bottom:4px;margin-bottom:8px;color:#0a7d4a!important;font-family:sans-serif}
  table{width:100%;border-collapse:collapse;margin:4px 0;font-size:8pt}
  th,td{border:1px solid #ccc;padding:4px 6px;text-align:left}
  th{background:#e8f5ec!important;color:#0a7d4a!important;font-weight:700}
  tr:nth-child(even) td{background:#f8faf8!important}
  .green-warn{border:2px solid #0a7d4a;border-radius:8px;padding:10px;text-align:center;margin-top:14px;font-size:8pt;color:#0a7d4a!important}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .sum-box{border:1px solid #ccc;border-radius:6px;padding:8px;text-align:center}
  .sum-box .big{font-size:14pt;font-weight:800;color:#0a7d4a!important;display:block}
  .sum-box .sm{font-size:7pt;color:#666!important}
}

/* ─── RESPONSIVE ─── */
@media(max-width:640px){
  .grid2{grid-template-columns:1fr!important}
  .grid3{grid-template-columns:1fr 1fr!important}
  .grid4{grid-template-columns:1fr 1fr!important}
}
</style>
</head>
<body>

<!-- TOAST -->
<div id="toasts"></div>

<!-- PRINT ZONE -->
<div id="printZone" style="display:none;padding:20px;max-width:900px;margin:0 auto;font-family:sans-serif"></div>

<!-- SPLASH -->
<div id="splash">
  <canvas id="splashCanvas"></canvas>
  <div class="sc">
    <div class="logo-glow" style="display:inline-block;margin-bottom:18px">
      <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0FBF7A,#C8970F);display:flex;align-items:center;justify-content:center;margin:0 auto">
        <i class="fas fa-leaf" style="font-size:26px;color:#050D08"></i>
      </div>
    </div>
    <h1 style="font-size:24px;background:linear-gradient(135deg,#0FBF7A,#C8970F);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px">Prodify Green Nexus</h1>
    <p style="font-size:11px;color:#5A9470;margin-bottom:24px">Sustainability Intelligence Platform</p>
    <div style="display:flex;align-items:center;justify-content:center;gap:10px">
      <div style="width:18px;height:18px;border:2px solid #0FBF7A;border-top-color:transparent;border-radius:50%" class="spin-ring"></div>
      <span style="font-size:11px;color:#5A9470">Initializing Sustainability Intelligence Engine…</span>
    </div>
  </div>
</div>

<!-- RISK MODAL -->
<div class="mo" id="riskModal">
  <div class="mb">
    <h3 style="font-size:14px;margin-bottom:12px">Add Risk Entry</h3>
    <div style="display:flex;flex-direction:column;gap:9px">
      <div><label class="lbl">Description *</label><input type="text" id="rDesc" class="inp" placeholder="e.g., Flash flood risk during construction"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
        <div><label class="lbl">Likelihood (1–5)</label>
          <select id="rL" class="sel"><option value="1">1 – Rare</option><option value="2">2 – Unlikely</option><option value="3" selected>3 – Possible</option><option value="4">4 – Likely</option><option value="5">5 – Almost Certain</option></select>
        </div>
        <div><label class="lbl">Impact (1–5)</label>
          <select id="rI" class="sel"><option value="1">1 – Negligible</option><option value="2">2 – Minor</option><option value="3" selected>3 – Moderate</option><option value="4">4 – Major</option><option value="5">5 – Catastrophic</option></select>
        </div>
      </div>
      <div><label class="lbl">Category</label>
        <select id="rCat" class="sel"><option>Environmental</option><option>Health &amp; Safety</option><option>Operational</option><option>Regulatory</option><option>Financial</option><option>Structural</option><option>Cyber / Technology</option></select>
      </div>
      <div><label class="lbl">Treatment Strategy</label>
        <select id="rTreat" class="sel"><option>Mitigate</option><option>Transfer (Insurance)</option><option>Avoid</option><option>Accept</option></select>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:9px;margin-top:14px">
      <button class="btn-ghost" onclick="el('riskModal').classList.remove('show')">Cancel</button>
      <button class="btn-primary" id="rAddBtn">Add Risk</button>
    </div>
  </div>
</div>

<!-- STEP BAR -->
<div id="stepBar" style="display:none">
  <div style="max-width:700px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:2px;margin-bottom:4px" id="stepperDots"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:7px">
        <div style="width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#0FBF7A,#C8970F);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="fas fa-leaf" style="font-size:9px;color:#050D08"></i>
        </div>
        <span style="font-size:10px;font-weight:700;color:var(--fg)">Prodify Green Nexus</span>
      </div>
      <span style="font-size:9px;color:var(--muted)" id="stepHint"></span>
    </div>
  </div>
</div>

<!-- APP WRAP -->
<div id="appWrap" style="display:none"></div>

<script>
/* ═══════════════════════════════════════════════════
   DATA DEFINITIONS — All technical data for assessment
   ═══════════════════════════════════════════════════ */

/* LEED v4.1 BD+C — Full credit structure with accurate points */
const LEED_DATA = [
  { cat:'Integrative Process', abbr:'IP', max:1, icon:'fa-arrows-spin', cr:[
    { n:'Integrative Process', p:1, t:'y', prereq:false,
      q:'Was an integrative design process conducted with cross-disciplinary team collaboration from pre-design stage, covering energy, water, site, and materials?',
      ref:'LEED v4.1 BD+C IP Credit — Integrative Process' }
  ]},
  { cat:'Location & Transportation', abbr:'LT', max:16, icon:'fa-location-dot', cr:[
    { n:'LEED for Neighborhood Development', p:16, t:'y', prereq:false,
      q:'Is the project located within a LEED-certified Neighborhood Development plan boundary?',
      note:'If yes, earns up to 16 pts — most LT credits inapplicable.',
      ref:'LEED v4.1 LT Credit: LEED ND Location' },
    { n:'Sensitive Land Protection', p:1, t:'y', prereq:false,
      q:'Is the building located on previously developed land, avoiding prime farmland, floodplains, wetlands, water bodies, threatened species habitat, and public parkland?',
      ref:'LEED v4.1 LT Credit: Sensitive Land Protection' },
    { n:'High Priority Site', p:2, t:'c', prereq:false,
      q:'What is the site\'s priority designation?',
      o:[['Standard site / no priority',0],['Brownfield redevelopment',1],['EPA National Priority List + historic + community priority',2]],
      ref:'LEED v4.1 LT Credit: High Priority Site' },
    { n:'Surrounding Density & Diverse Uses', p:5, t:'c', prereq:false,
      q:'What level of surrounding density and diverse uses exists within 800m walking distance?',
      o:[['Low density / single use',0],['Moderate density / 4+ uses',3],['High density / 8+ uses within 400m',5]],
      ref:'LEED v4.1 LT Credit: Surrounding Density' },
    { n:'Access to Quality Transit', p:5, t:'c', prereq:false,
      q:'Quality transit stops within walking distance with frequent service?',
      o:[['No transit within 800m',0],['Bus/rail within 800m, <50 trips/day',2],['Within 400m, 50–99 trips/day',3],['Within 400m, 100+ weekday trips',5]],
      ref:'LEED v4.1 LT Credit: Access to Quality Transit' },
    { n:'Bicycle Facilities', p:1, t:'y', prereq:false,
      q:'Are secure long-term bicycle storage racks (per LEED ratio) AND on-site shower/changing facilities provided for regular cyclists?',
      ref:'LEED v4.1 LT Credit: Bicycle Facilities' },
    { n:'Reduced Parking Footprint', p:1, t:'y', prereq:false,
      q:'Is the designed parking capacity ≤30% below the local code minimum, OR zero parking provided?',
      ref:'LEED v4.1 LT Credit: Reduced Parking' },
    { n:'Green Vehicles', p:1, t:'y', prereq:false,
      q:'Is preferred parking provided for green vehicles AND/OR Level 2 EV charging for ≥5% of total parking spaces?',
      ref:'LEED v4.1 LT Credit: Green Vehicles' }
  ]},
  { cat:'Sustainable Sites', abbr:'SS', max:10, icon:'fa-seedling', cr:[
    { n:'Construction Activity Pollution Prevention', p:0, t:'p', prereq:true,
      q:'Is erosion and sedimentation control implemented per EPA Construction General Permit (CGP) requirements — including sediment basins, perimeter controls, and velocity dissipation?',
      ref:'LEED v4.1 SS Prerequisite: Construction Pollution Prevention' },
    { n:'Site Assessment', p:1, t:'y', prereq:false,
      q:'Has a comprehensive site assessment been documented covering topography, hydrology, climate, soils, vegetation, wildlife, and transport?',
      ref:'LEED v4.1 SS Credit: Site Assessment' },
    { n:'Protect or Restore Habitat', p:2, t:'c', prereq:false,
      q:'What percentage of the site (excluding footprint) is restored with native/adapted vegetation?',
      o:[['Less than 25%',0],['25–49% of site area',1],['50% or more of site area',2]],
      ref:'LEED v4.1 SS Credit: Protect or Restore Habitat' },
    { n:'Open Space', p:1, t:'y', prereq:false,
      q:'Is outdoor open space ≥30% of total site area, with ≥25% of that space vegetated (not hardscape)?',
      ref:'LEED v4.1 SS Credit: Open Space' },
    { n:'Rainwater Management', p:3, t:'c', prereq:false,
      q:'What percentile storm event is managed on-site with zero increase in runoff rate/volume compared to natural hydrology?',
      o:[['Less than 75th percentile managed',0],['75th percentile event managed',1],['85th percentile event managed',2],['95th percentile event managed',3]],
      ref:'LEED v4.1 SS Credit: Rainwater Management' },
    { n:'Heat Island Reduction', p:2, t:'c', prereq:false,
      q:'Heat island mitigation measures installed?',
      o:[['None or minimal',0],['High-reflectance roof OR 50%+ shaded/permeable hardscape',1],['Both high-reflectance roof AND hardscape measures',2]],
      ref:'LEED v4.1 SS Credit: Heat Island Reduction' },
    { n:'Light Pollution Reduction', p:1, t:'y', prereq:false,
      q:'Does exterior lighting comply with IESNA/IDA zone illumination limits — reducing uplight, glare, and light trespass on neighboring sites?',
      ref:'LEED v4.1 SS Credit: Light Pollution Reduction' }
  ]},
  { cat:'Water Efficiency', abbr:'WE', max:11, icon:'fa-droplet', cr:[
    { n:'Outdoor Water Use Reduction — Prereq', p:0, t:'p', prereq:true,
      q:'Is outdoor irrigation water use reduced ≥30% from a calculated midsummer baseline (no irrigation = automatic compliance)?',
      ref:'LEED v4.1 WE Prerequisite: Outdoor Water Use Reduction' },
    { n:'Indoor Water Use Reduction — Prereq', p:0, t:'p', prereq:true,
      q:'Are all installed fixtures (lavatories, toilets, urinals, showers, kitchen sinks) ≥20% below the LEED baseline calculated using EPA WaterSense flow rates?',
      ref:'LEED v4.1 WE Prerequisite: Indoor Water Use Reduction' },
    { n:'Building-Level Water Metering — Prereq', p:0, t:'p', prereq:true,
      q:'Is a permanent whole-building water meter installed with data sharing capability for USGBC portfolio benchmarking?',
      ref:'LEED v4.1 WE Prerequisite: Water Metering' },
    { n:'Outdoor Water Use Reduction', p:2, t:'c', prereq:false,
      q:'Outdoor water reduction beyond the 30% prerequisite?',
      o:[['30% reduction (prereq only)',0],['50% reduction',1],['No permanent irrigation / 70%+ reduction',2]],
      ref:'LEED v4.1 WE Credit: Outdoor Water Reduction' },
    { n:'Indoor Water Use Reduction', p:6, t:'c', prereq:false,
      q:'Whole-building indoor water reduction percentage below LEED baseline (using WaterSense and EPA guidelines)?',
      o:[['20–24% reduction',1],['25–29%',2],['30–34%',3],['35–39%',4],['40–44%',5],['≥45% reduction',6]],
      ref:'LEED v4.1 WE Credit: Indoor Water — up to 6 pts' },
    { n:'Cooling Tower Water Use', p:2, t:'c', prereq:false,
      q:'Is cooling tower water use optimized using makeup water quality analysis?',
      o:[['N/A (no cooling tower)',0],['Cycles of concentration optimized (minimum 10)',1],['Optimized cycles + ≥50% non-potable makeup water',2]],
      ref:'LEED v4.1 WE Credit: Cooling Tower' },
    { n:'Water Metering (Subsystems)', p:1, t:'y', prereq:false,
      q:'Are permanent submeters installed on ≥2 major water-consuming systems (irrigation, indoor plumbing, cooling tower, etc.)?',
      ref:'LEED v4.1 WE Credit: Water Metering' }
  ]},
  { cat:'Energy & Atmosphere', abbr:'EA', max:33, icon:'fa-bolt', cr:[
    { n:'Fundamental Commissioning — Prereq', p:0, t:'p', prereq:true,
      q:'Has fundamental building systems commissioning been conducted per ASHRAE Guideline 0-2019 and NIBS Guideline 3-2012?',
      ref:'LEED v4.1 EA Prerequisite: Fundamental Cx' },
    { n:'Minimum Energy Performance — Prereq', p:0, t:'p', prereq:true,
      q:'Does the building demonstrate minimum energy performance ≥5% better than ASHRAE 90.1-2016 whole building baseline?',
      ref:'LEED v4.1 EA Prerequisite: Minimum Energy' },
    { n:'Building-Level Energy Metering — Prereq', p:0, t:'p', prereq:true,
      q:'Is a permanent building-level energy meter (electricity and all fuels) installed with data sharing capability?',
      ref:'LEED v4.1 EA Prerequisite: Energy Metering' },
    { n:'No CFC Refrigerants — Prereq', p:0, t:'p', prereq:true,
      q:'Are all base building HVAC&R systems free from CFC-based refrigerants? (Phaseout plan in place for existing systems?)',
      ref:'LEED v4.1 EA Prerequisite: Fundamental Refrigerant Management' },
    { n:'Enhanced Commissioning', p:6, t:'c', prereq:false,
      q:'Enhanced commissioning scope?',

function el(id){ return document.getElementById(id) }
function esc(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,"&quot;") }
function toast(msg, type='success'){
  const c=el('toasts');
  const cols={success:'#0FBF7A',warning:'#C8970F',error:'#E84444',info:'#3B82F6'};
  const ics={success:'fa-check-circle',warning:'fa-triangle-exclamation',error:'fa-times-circle',info:'fa-info-circle'};
  const d=document.createElement('div');
  d.className='toast';d.style.background=cols[type];
  d.innerHTML=`<i class="fas ${ics[type]}"></i>${msg}`;
  c.appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300)},3000);
}

/* ═══════════════════════════════════════════════════
   SCORING FUNCTIONS
   ═══════════════════════════════════════════════════ */
function calcLeedEnergyPts(pct){
  if(pct<6)return 0;if(pct<10)return 1;if(pct<15)return 3;if(pct<20)return 5;
  if(pct<25)return 7;if(pct<30)return 9;if(pct<35)return 11;if(pct<40)return 13;
  if(pct<45)return 15;if(pct<50)return 16;if(pct<55)return 17;return 18;
}
function calcLeedRenPts(pct){
  if(pct<1)return 0;if(pct<5)return 1;if(pct<10)return 2;if(pct<20)return 3;if(pct<30)return 4;return 5;
}

function leedScore(){
  let total=0, catScores=[], prereqOK=true;
  for(let ci=0;ci<LEED_DATA.length;ci++){
    const cat=LEED_DATA[ci]; let cp=0;
    for(const cr of cat.cr){
      const v=ST.leed[cr.n];
      if(cr.prereq){
        if(!v) prereqOK=false;
        continue;
      }
      if(cr.t==='y'){ if(v===true) cp+=cr.p }
      else if(cr.t==='c'){ if(v!=null&&cr.o&&cr.o[v]) cp+=cr.o[v][1] }
      else if(cr.t==='s'){
        const val=v||0;
        if(cr.n==='Optimize Energy Performance') cp+=calcLeedEnergyPts(val);
        else if(cr.n==='Renewable Energy Production') cp+=calcLeedRenPts(val);
      }
    }
    cp=Math.min(cp,cat.max);
    catScores.push({a:cat.abbr,c:cat.cat,p:cp,m:cat.max,icon:cat.icon});
    total+=cp;
  }
  total=Math.min(total,110);
  const cert=!prereqOK?'INELIGIBLE':total>=80?'PLATINUM':total>=60?'GOLD':total>=50?'SILVER':total>=40?'CERTIFIED':'BELOW MIN';
  return{total,catScores,cert,prereqOK};
}

function wellScore(){
  let total=0, catScores=[];
  for(const w of WELL_DATA){
    let cp=0;
    for(const f of w.feats){ if(ST.well[f]) cp++ }
    cp=Math.min(cp,w.max);
    catScores.push({c:w.concept,p:cp,m:w.max,cl:w.color,icon:w.icon});
    total+=cp;
  }
  total=Math.min(total,100);
  const cert=total>=80?'PLATINUM':total>=60?'GOLD':total>=50?'SILVER':total>=40?'BRONZE':'BELOW MIN';
  return{total,catScores,cert};
}

function disScore(){
  let yes=0,n=0;
  for(const cat of DISASTER_DATA){ for(const q of cat.q){ n++; if(ST.dis[q]) yes++ }}
  return n?Math.round(yes/n*100):0;
}
function disCatScore(ci){
  const cat=DISASTER_DATA[ci]; let yes=0;
  for(const q of cat.q){ if(ST.dis[q]) yes++ }
  return{yes,total:cat.q.length,pct:cat.q.length?Math.round(yes/cat.q.length*100):0};
}

function calcCarbon(){
  const p=ST.proj;
  const gf=GRID_FACTORS[p.country]||0.49;
  const baseEUI_map=BASELINE_EUI[p.type]||BASELINE_EUI['Commercial Office'];
  const baseEUI=Object.entries(baseEUI_map).find(([k])=>p.climate.includes(k.split(' ')[0]))?.[1]||baseEUI_map[Object.keys(baseEUI_map)[0]]||200;
  const eImp=ST.leed['Optimize Energy Performance']||0;
  const renPct=ST.leed['Renewable Energy Production']||0;
  const adjEUI=baseEUI*(1-eImp/100);
  const annualEnergy=adjEUI*p.area; // kWh/yr
  const annualEnergyCovered=annualEnergy*(renPct/100);
  const gridEnergy=annualEnergy-annualEnergyCovered;
  const opCO2=gridEnergy*gf; // kgCO2/yr
  const esg=ST.esg;
  const esgElecCO2=(esg.elec||annualEnergy/1000)*gf*1000;
  const esgGasCO2=(esg.gas||0)*2.04*1000; // kg/m3 natural gas → 2.04 kgCO2/m3
  const totalCO2=opCO2; // primary calc from LEED data
  const co2Intensity=p.area?totalCO2/p.area:0;
  const embCO2=(esg.emb||0)*p.area; // kgCO2/m2 embodied
  const wCO2=(p.area*1.4)*0.344; // water CO2: ~1.4m3/m2/yr × 0.344 kgCO2/m3 (UK/UAE avg)
  const euThreshold=27.5;
  const uaeTarget=35;
  return{gf,baseEUI,adjEUI,annualEnergy,gridEnergy,opCO2,co2Intensity,eImp,renPct,embCO2,wCO2,euThreshold,uaeTarget,annualEnergyCovered};
}

function drawStepper(){
  const bar=el('stepperDots'); let h='';
  for(let i=0;i<STEPS.length;i++){
    const cls=i===ST.step?'active':i<ST.step?'done':'';
    h+=`<div style="display:flex;align-items:center;${i<STEPS.length-1?'flex:1':''}">`;
    h+=`<div style="display:flex;flex-direction:column;align-items:center">`;
    h+=`<div class="step-dot ${cls}" onclick="goStep(${i})">${i<ST.step?'<i class="fas fa-check" style="font-size:8px"></i>':i+1}</div>`;
    h+=`<span style="font-size:7px;margin-top:2px;${i===ST.step?'color:var(--em);font-weight:700':'color:var(--muted)'}" class="sbl">${STEPS[i]}</span>`;
    h+=`</div>`;
    if(i<STEPS.length-1) h+=`<div class="step-line ${i<ST.step?'done':''}"></div>`;
    h+=`</div>`;
  }
  bar.innerHTML=h;
  el('stepHint').textContent=`Step ${ST.step+1}/${STEPS.length} — ${STEPS[ST.step]}`;
}

function goStep(n){
  if(n>ST.step){
    if(ST.step===0&&!ST.user.name.trim()){toast('Please enter your name','warning');return}
    if(ST.step===1&&!ST.proj.name.trim()){toast('Please enter a project name','warning');return}
  }
  ST.step=Math.max(0,Math.min(STEPS.length-1,n));
  drawStepper(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

  h+=`<div style="display:flex;gap:8px">`;
  if(ST.lci>0) h+=`<button class="btn-ghost" onclick="ST.lci--;rLeed()"><i class="fas fa-chevron-left" style="margin-right:4px"></i>Prev</button>`;

  else h+=`<button class="btn-primary" onclick="toast('LEED complete: '+leedScore().total+' pts — '+leedScore().cert,'success');goStep(3)">Continue to WELL <i class="fas fa-arrow-right" style="margin-left:5px"></i></button>`;
  h+=`</div></div></div>`;

  const cc=certColor[sc.cert]||'#E84444';

  let h=`<div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">`;
  h+=`<div><h2 style="font-size:18px;margin-bottom:2px">WELL v2 Standard</h2>
    <p style="font-size:10px;color:var(--muted)">Toggle all features your building currently achieves or will achieve.</p></div>`;
  h+=`<div style="text-align:right">
    <span style="font-size:20px;font-weight:800;color:var(--rose)">${sc.total}</span><span style="font-size:11px;color:var(--muted)">/100 pts</span><br>
    <span class="cert" style="background:${cc}20;color:${cc}">${sc.cert}</span>
  </div>`;
  h+=`</div>`;

  // Concept overview
  h+=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">`;
  for(let i=0;i<WELL_DATA.length;i++){
    const w=WELL_DATA[i], active=i===ST.wci;
    const cp=sc.catScores[i];
    h+=`<button class="catTab${active?' active':''}" style="${active?'border-color:'+w.color+'50;background:'+w.color+'15;color:'+w.color:'color:var(--muted)'}" onclick="ST.wci=${i};rWell()">
      <i class="fas ${w.icon}" style="margin-right:3px;font-size:9px"></i>${w.concept} ${cp.p}/${cp.m}
    </button>`;
  }
  h+=`</div>`;

  // Current concept header
  h+=`<div class="glass" style="border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">`;
  h+=`<div style="display:flex;align-items:center;gap:8px">
    <div style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${con.color}15;flex-shrink:0">
      <i class="fas ${con.icon}" style="color:${con.color};font-size:13px"></i>
    </div>
    <div><div style="font-size:13px;font-weight:700">${con.concept}</div>
    <div style="font-size:9px;color:var(--muted)">${con.feats.length} features · Max ${con.max} pts</div></div>
  </div>`;
  h+=`<div style="text-align:right">
    <span style="font-size:16px;font-weight:800;color:${con.color}">${cs.p}</span>
    <span style="font-size:9px;color:var(--muted)">/${cs.m}</span>
    <div class="pbar" style="width:90px;margin-top:4px"><div class="pfill" style="width:${cs.m?Math.round(cs.p/cs.m*100):0}%;background:${con.color}"></div></div>
  </div>`;
  h+=`</div>`;

  // Features
  for(const f of con.feats){
    const v=ST.well[f];
    h+=`<div class="qcard" style="display:flex;align-items:flex-start;gap:8px;padding:9px 11px">`;
    h+=`<div class="chk${v?' on':''}" style="margin-top:1px;flex-shrink:0" onclick="ST.well['${esc(f)}']=!ST.well['${esc(f)}'];rWell()">
      ${v?'<i class="fas fa-check" style="font-size:8px;color:var(--bg)"></i>':''}
    </div>`;
    h+=`<p style="font-size:10px;line-height:1.6;color:${v?'var(--muted)':'var(--fg)'};${v?'text-decoration:line-through;opacity:.7':''}">${f}</p>`;
    h+=`</div>`;
  }

  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">`;
  h+=`<button class="btn-ghost" onclick="goStep(2)"><i class="fas fa-arrow-left" style="margin-right:5px"></i>Back</button>`;
  h+=`<div style="display:flex;gap:8px">`;
  if(ST.wci>0) h+=`<button class="btn-ghost" onclick="ST.wci--;rWell()"><i class="fas fa-chevron-left" style="margin-right:4px"></i>Prev</button>`;
  if(ST.wci<WELL_DATA.length-1) h+=`<button class="btn-primary" onclick="ST.wci++;rWell()">Next Concept <i class="fas fa-chevron-right" style="margin-left:4px"></i></button>`;
  else h+=`<button class="btn-primary" onclick="toast('WELL complete: '+wellScore().total+' pts — '+wellScore().cert,'success');goStep(4)">Continue to Disaster <i class="fas fa-arrow-right" style="margin-left:5px"></i></button>`;
  h+=`</div></div></div>`;
  el('appWrap').innerHTML=h;
}

/* ═══════════════════════════════════════════════════
   STEP 4 — DISASTER RESILIENCE
   ═══════════════════════════════════════════════════ */
function rDisaster(){
  const ds=disScore(), cat=DISASTER_DATA[ST.dci], cs=disCatScore(ST.dci);

  let h=`<div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">`;
  h+=`<div><h2 style="font-size:18px;margin-bottom:2px">Disaster Resilience</h2>
    <p style="font-size:10px;color:var(--muted)">Assess emergency preparedness per hazard category.</p></div>`;
  h+=`<div style="text-align:right">
    <span style="font-size:20px;font-weight:800;color:var(--blue)">${ds}%</span>
    <div style="font-size:9px;color:var(--muted)">${ds>=80?'Highly Resilient':ds>=60?'Adequate':ds>=40?'Moderate':'Vulnerable'}</div>
  </div>`;
  h+=`</div>`;

  // Hazard tabs
  h+=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">`;
  for(let i=0;i<DISASTER_DATA.length;i++){
    const d=DISASTER_DATA[i], active=i===ST.dci;
    const cp=disCatScore(i);
    h+=`<button class="catTab${active?' active':''}" style="${active?'border-color:'+d.color+'50;background:'+d.color+'15;color:'+d.color:'color:var(--muted)'}" onclick="ST.dci=${i};rDisaster()">
      <i class="fas ${d.icon}" style="margin-right:3px;font-size:9px"></i>${d.cat} ${cp.pct}%
    </button>`;
  }
  h+=`</div>`;

  // Category header
  h+=`<div class="glass" style="border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">`;
  h+=`<div style="display:flex;align-items:center;gap:8px">
    <div style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${cat.color}15;flex-shrink:0">
      <i class="fas ${cat.icon}" style="color:${cat.color};font-size:13px"></i>
    </div>
    <div><div style="font-size:13px;font-weight:700">${cat.cat}</div>
    <div style="font-size:9px;color:var(--muted)">${cat.q.length} measures</div></div>
  </div>`;
  h+=`<div style="text-align:right">
    <span style="font-size:16px;font-weight:800;color:${cat.color}">${cs.pct}%</span>
    <span style="font-size:9px;color:var(--muted)"> (${cs.yes}/${cs.total})</span>
    <div class="pbar" style="width:90px;margin-top:4px"><div class="pfill" style="width:${cs.pct}%;background:${cat.color}"></div></div>
  </div>`;
  h+=`</div>`;

  // Questions
  for(const q of cat.q){
    const v=ST.dis[q];
    h+=`<div class="qcard" style="display:flex;align-items:flex-start;gap:8px;padding:9px 11px">`;
    h+=`<div class="chk${v?' on':''}" style="margin-top:1px;flex-shrink:0" onclick="ST.dis['${esc(q)}']=!ST.dis['${esc(q)}'];rDisaster()">
      ${v?'<i class="fas fa-check" style="font-size:8px;color:var(--bg)"></i>':''}
    </div>`;
    h+=`<p style="font-size:10px;line-height:1.6;color:${v?'var(--muted)':'var(--fg)'};${v?'opacity:.7':''}">${q}</p>`;
    h+=`</div>`;
  }

  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">`;
  h+=`<button class="btn-ghost" onclick="goStep(3)"><i class="fas fa-arrow-left" style="margin-right:5px"></i>Back</button>`;
  h+=`<div style="display:flex;gap:8px">`;
  if(ST.dci>0) h+=`<button class="btn-ghost" onclick="ST.dci--;rDisaster()"><i class="fas fa-chevron-left" style="margin-right:4px"></i>Prev</button>`;
  if(ST.dci<DISASTER_DATA.length-1) h+=`<button class="btn-primary" onclick="ST.dci++;rDisaster()">Next Hazard <i class="fas fa-chevron-right" style="margin-left:4px"></i></button>`;
  else h+=`<button class="btn-primary" onclick="toast('Disaster assessment: '+disScore()+'% resilience','success');goStep(5)">Continue to Risk <i class="fas fa-arrow-right" style="margin-left:5px"></i></button>`;
  h+=`</div></div></div>`;
  el('appWrap').innerHTML=h;
}

/* ═══════════════════════════════════════════════════
   STEP 5 — RISK ASSESSMENT
   ═══════════════════════════════════════════════════ */
function rRisk(){
  let h=`<div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">`;
  h+=`<div><h2 style="font-size:18px;margin-bottom:2px">Risk Assessment</h2>
    <p style="font-size:10px;color:var(--muted)">5×5 ISO 31000 risk matrix. Add project-specific risks.</p></div>`;
  h+=`<button class="btn-primary" style="font-size:11px;padding:7px 14px" onclick="el('riskModal').classList.add('show')">
    <i class="fas fa-plus" style="margin-right:5px"></i>Add Risk
  </button>`;
  h+=`</div>`;

  h+=`<div style="display:grid;grid-template-columns:3fr 2fr;gap:12px" class="grid2">`;

  // Risk Matrix
  h+=`<div class="glass" style="border-radius:12px;padding:14px">`;
  h+=`<h4 style="font-size:11px;margin-bottom:10px;font-family:sans-serif">Likelihood × Impact Matrix <span style="font-size:8px;color:var(--muted)">(ISO 31000)</span></h4>`;
  h+=`<div style="display:flex;gap:4px">`;
  h+=`<div style="display:flex;flex-direction:column;justify-content:space-between;padding-bottom:20px">`;
  for(let l=5;l>=1;l--) h+=`<div style="font-size:7px;color:var(--muted);text-align:right;width:12px;line-height:44px">${l}</div>`;
  h+=`</div>`;
  h+=`<div style="flex:1">`;
  h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px">`;
  for(let l=5;l>=1;l--){
    for(let i=1;i<=5;i++){
      const sc=l*i, col=rCol(sc);
      const here=ST.risks.filter(r=>r.l===l&&r.i===i);
      h+=`<div class="rcell" style="background:${col}20;color:${col};flex-direction:column;gap:1px" onclick="if(${here.length})toast('${here.map(r=>r.desc.substring(0,30)).join(' | ')}','info')">
        <span style="font-size:11px">${sc}</span>
        ${here.length?`<span style="font-size:8px;background:${col}35;padding:1px 4px;border-radius:3px">${here.length}</span>`:''}
      </div>`;
    }
  }
  h+=`</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:3px">`;
  ['Neg','Minor','Mod','Major','Catas'].forEach(l=>{ h+=`<div style="font-size:7px;color:var(--muted);text-align:center">${l}</div>` });
  h+=`</div>`;
  h+=`<div style="font-size:8px;color:var(--muted);text-align:center;margin-top:2px;font-weight:700;letter-spacing:.1em">IMPACT →</div>`;
  h+=`</div></div>`;
  // Legend
  h+=`<div style="display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">`;
  [{c:'#22C55E',l:'Low (1–4)'},{c:'#EAB308',l:'Med (5–9)'},{c:'#F97316',l:'High (10–16)'},{c:'#EF4444',l:'Critical (17–25)'}].forEach(x=>{
    h+=`<div style="display:flex;align-items:center;gap:4px"><div style="width:9px;height:9px;border-radius:2px;background:${x.c}"></div><span style="font-size:8px;color:var(--muted)">${x.l}</span></div>`;
  });
  h+=`</div></div>`;

  // Risk Register
  h+=`<div class="glass" style="border-radius:12px;padding:14px">`;
  h+=`<h4 style="font-size:11px;margin-bottom:10px;font-family:sans-serif">Risk Register <span style="font-size:9px;color:var(--muted)">(${ST.risks.length} entries)</span></h4>`;
  h+=`<div style="max-height:340px;overflow-y:auto">`;
  if(ST.risks.length){
    // Summary bars
    const crit=ST.risks.filter(r=>r.l*r.i>=17).length;
    const high=ST.risks.filter(r=>{const s=r.l*r.i;return s>=10&&s<17}).length;
    const med=ST.risks.filter(r=>{const s=r.l*r.i;return s>=5&&s<10}).length;
    const low=ST.risks.filter(r=>r.l*r.i<5).length;
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-bottom:8px">`;
    [{c:'#EF4444',l:'Critical',n:crit},{c:'#F97316',l:'High',n:high},{c:'#EAB308',l:'Med',n:med},{c:'#22C55E',l:'Low',n:low}].forEach(x=>{
      h+=`<div style="text-align:center;padding:5px;border-radius:6px;background:${x.c}10;border:1px solid ${x.c}20">
        <div style="font-size:14px;font-weight:800;color:${x.c}">${x.n}</div>
        <div style="font-size:7px;color:var(--muted)">${x.l}</div>
      </div>`;
    });
    h+=`</div>`;
    for(let ri=0;ri<ST.risks.length;ri++){
      const rk=ST.risks[ri], s=rk.l*rk.i, col=rCol(s);
      h+=`<div style="padding:7px 9px;border-radius:7px;background:rgba(9,20,9,.6);border-left:3px solid ${col};margin-bottom:5px;position:relative">`;
      h+=`<div style="font-size:10px;font-weight:600;padding-right:20px">${rk.desc}</div>`;
      h+=`<div style="display:flex;gap:8px;font-size:8px;margin-top:3px">
        <span style="color:${col};font-weight:700">${rLvl(s)} (${s})</span>
        <span style="color:var(--muted)">L${rk.l}×I${rk.i}</span>
        <span style="color:var(--muted)">${rk.cat}</span>
        <span style="color:var(--muted)">${rk.treat}</span>
      </div>`;
      h+=`<span onclick="ST.risks.splice(${ri},1);rRisk()" style="position:absolute;top:6px;right:8px;cursor:pointer;color:var(--muted);font-size:10px;font-family:sans-serif" title="Remove">✕</span>`;
      h+=`</div>`;
    }
  } else {
    h+=`<div style="text-align:center;padding:28px 0;color:var(--muted);font-size:10px">
      <i class="fas fa-shield-halved" style="font-size:24px;display:block;margin-bottom:8px;opacity:.3"></i>
      No risks added yet. Click "Add Risk" to begin.
    </div>`;
  }
  h+=`</div></div>`;
  h+=`</div>`;

  h+=`<div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">`;
  h+=`<button class="btn-ghost" onclick="goStep(4)"><i class="fas fa-arrow-left" style="margin-right:5px"></i>Back</button>`;
  h+=`<button class="btn-primary" onclick="goStep(6)">Continue to ESG & Carbon <i class="fas fa-arrow-right" style="margin-left:5px"></i></button>`;
  h+=`</div></div>`;
  el('appWrap').innerHTML=h;
}

/* ═══════════════════════════════════════════════════
   STEP 6 — ESG & CARBON
   ═══════════════════════════════════════════════════ */
function rESG(){
  const carb=calcCarbon();
  let h=`<div>`;
  h+=`<h2 style="font-size:18px;margin-bottom:4px">ESG & Carbon Analysis</h2>`;
  h+=`<p style="font-size:10px;color:var(--muted);margin-bottom:14px">Carbon calculations use LEED EA data + GHG Protocol methodology. Refine with actual consumption data.</p>`;

  // Auto-calculated from LEED data
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px" class="grid4">`;
  const cards=[
    {label:'Adjusted EUI',val:carb.adjEUI.toFixed(0),unit:'kWh/m²/yr',color:'var(--cyan)',icon:'fa-bolt',
     note:`Baseline ${carb.baseEUI} kWh/m²/yr × (1 − ${carb.eImp}% improvement)`},
    {label:'Annual Energy',val:(carb.annualEnergy/1000).toFixed(1),unit:'MWh/yr',color:'var(--amber)',icon:'fa-solar-panel',
     note:`${ST.proj.area.toLocaleString()} m² × ${carb.adjEUI.toFixed(0)} kWh/m²`},
    {label:'Carbon Intensity',val:carb.co2Intensity.toFixed(1),unit:'kgCO2/m²/yr',color:carb.co2Intensity>35?'var(--red)':'var(--em)',icon:'fa-cloud',
     note:`Grid: ${carb.gf} kgCO2e/kWh (${ST.proj.country})`},
    {label:'Annual Emissions',val:(carb.opCO2/1000).toFixed(1),unit:'tCO2e/yr',color:'var(--gold)',icon:'fa-leaf',
     note:`${(carb.annualEnergyCovered/1000).toFixed(1)} MWh/yr avoided by renewables`}
  ];
  cards.forEach(c=>{
    h+=`<div class="kpi">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">${c.label}</span>
        <i class="fas ${c.icon}" style="color:${c.color};font-size:11px"></i>
      </div>
      <div style="font-size:20px;font-weight:800;color:${c.color}">${c.val}</div>
      <div style="font-size:8px;color:var(--muted);margin-bottom:4px">${c.unit}</div>
      <div style="font-size:8px;color:var(--muted);line-height:1.4">${c.note}</div>
    </div>`;
  });
  h+=`</div>`;

  // Compliance check
  h+=`<div class="glass" style="border-radius:12px;padding:14px;margin-bottom:14px">`;
  h+=`<h4 style="font-size:12px;margin-bottom:10px">Compliance Thresholds</h4>`;
  const checks=[
    {label:'EU Taxonomy (Climate Mitigation) — nZEB',threshold:27.5,val:carb.co2Intensity,unit:'kgCO2/m²/yr',ref:'EU Taxonomy Regulation 2020/852 Annex I'},
    {label:'UAE Al Sa\'fat — Green Building Intensity',threshold:40,val:carb.co2Intensity,unit:'kgCO2/m²/yr',ref:'Dubai Decree No. 23/2017'},
    {label:'LEED EA Prereq — Minimum Energy (5% vs ASHRAE 90.1)',threshold:5,val:carb.eImp,unit:'% improvement',ref:'LEED v4.1 EA Prerequisite',higher:true},
    {label:'LEED EA Optimize — Gold threshold (25%+ improvement)',threshold:25,val:carb.eImp,unit:'% improvement',ref:'LEED v4.1 EA Credit',higher:true}
  ];
  checks.forEach(ck=>{
    const ok=ck.higher?(ck.val>=ck.threshold):(ck.val<=ck.threshold);
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">`;
    h+=`<div><div style="font-size:10px;font-weight:600">${ck.label}</div>
      <div style="font-size:8px;color:var(--muted)">${ck.ref}</div></div>`;
    h+=`<div style="text-align:right">
      <span style="font-size:11px;font-weight:800;color:${ok?'var(--em)':'var(--red)'}">${ck.val.toFixed(1)} ${ck.unit}</span><br>
      <span style="font-size:8px;color:${ok?'var(--em)':'var(--red)'}">${ok?'✓ COMPLIANT':'✗ NON-COMPLIANT'} (threshold: ${ck.threshold})</span>
    </div>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  // Optional actual data entry
  h+=`<div class="glass" style="border-radius:12px;padding:14px;margin-bottom:14px">`;
  h+=`<h4 style="font-size:12px;margin-bottom:3px">Optional: Actual Energy Data</h4>`;
  h+=`<p style="font-size:9px;color:var(--muted);margin-bottom:10px">Override auto-calculated values with measured data (if available).</p>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">`;
  h+=`<div><label class="lbl">Electricity (MWh/yr)</label>
    <input type="number" id="eeElec" class="inp" value="${ST.esg.elec||''}" placeholder="Auto-calculated" oninput="ST.esg.elec=+this.value"></div>`;
  h+=`<div><label class="lbl">Gas Consumption (m³/yr)</label>
    <input type="number" id="eeGas" class="inp" value="${ST.esg.gas||''}" placeholder="0" oninput="ST.esg.gas=+this.value"></div>`;
  h+=`<div><label class="lbl">Embodied Carbon (kgCO2/m²)</label>
    <input type="number" id="eeEmb" class="inp" value="${ST.esg.emb||''}" placeholder="e.g., 350" oninput="ST.esg.emb=+this.value"></div>`;
  h+=`</div></div>`;

  // ESG scoring
  const ls=leedScore(), ws=wellScore(), ds=disScore();
  const E_score=Math.min(100,Math.round((1-carb.co2Intensity/100)*50+ls.catScores[4].p/33*30+carb.renPct/50*20));
  const S_score=Math.round(ws.total*0.7+ds*0.3);
  const G_score=Math.round((ls.total/110)*60+(ds/100)*40);
  const ESG_total=Math.round((E_score+S_score+G_score)/3);
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px" class="grid4">`;
  [{label:'Environmental (E)',val:E_score,color:'var(--em)',note:'Energy, carbon, renewables, water'},{label:'Social (S)',val:S_score,color:'var(--rose)',note:'WELL wellness + disaster preparedness'},{label:'Governance (G)',val:G_score,color:'var(--purple)',note:'LEED compliance + resilience planning'},{label:'ESG Total',val:ESG_total,color:'var(--gold)',note:'Composite ESG score'}].forEach(c=>{
    h+=`<div class="kpi"><div style="font-size:8px;color:var(--muted);text-transform:uppercase;margin-bottom:4px">${c.label}</div>
      <div style="font-size:22px;font-weight:800;color:${c.color}">${c.val}</div>
      <div style="font-size:8px;color:var(--muted)">/100</div>
      <div class="pbar" style="margin-top:6px"><div class="pfill" style="width:${c.val}%;background:${c.color}"></div></div>
      <div style="font-size:8px;color:var(--muted);margin-top:4px">${c.note}</div>
    </div>`;
  });
  h+=`</div>`;

  h+=`<div style="display:flex;justify-content:space-between;margin-top:4px">`;
  h+=`<button class="btn-ghost" onclick="goStep(5)"><i class="fas fa-arrow-left" style="margin-right:5px"></i>Back</button>`;

/* ═══════════════════════════════════════════════════
   STEP 7 — REPORT
   ═══════════════════════════════════════════════════ */
function rReport(){
  const ls=leedScore(), ws=wellScore(), ds=disScore(), carb=calcCarbon();
  const p=ST.proj, u=ST.user;
  const ls_cs=ls.catScores, ws_cs=ws.catScores;

  const E_score=Math.min(100,Math.round((1-carb.co2Intensity/100)*50+ls.catScores[4].p/33*30+carb.renPct/50*20));
  const S_score=Math.round(ws.total*0.7+ds*0.3);
  const G_score=Math.round((ls.total/110)*60+(ds/100)*40);
  const ESG_total=Math.round((E_score+S_score+G_score)/3);

  // Auto-generate recommendations
  const recs=[];
  if(ls.total<40) recs.push({sev:'critical',text:`LEED score is ${ls.total}/110 — below minimum for Certified (40 pts). Prioritize prerequisites and Energy & Atmosphere credits (up to 33 pts).`});
  else if(ls.total<60) recs.push({sev:'warning',text:`LEED at ${ls.total}/110 (${ls.cert}). Target Gold (60 pts) by focusing on Optimize Energy Performance (up to 18 pts available).`});
  const eimp=ST.leed['Optimize Energy Performance']||0;
  if(eimp<20) recs.push({sev:'warning',text:`Energy improvement at ${eimp}% is below LEED Gold threshold. Target ≥25% via HVAC optimization (${p.hvac}), envelope upgrade, and demand response integration.`});
  const renPct=ST.leed['Renewable Energy Production']||0;
  if(renPct<10) recs.push({sev:'warning',text:`On-site renewable energy at ${renPct}%. Rooftop PV in ${p.climate.includes('Hot')?'hot arid climate can achieve 22–28%+ capacity factor.':'temperate climate can achieve 12–18% of building load.'}`});
  if(!ST.leed['Enhanced Commissioning']) recs.push({sev:'info',text:'Enhanced Commissioning (LEED EA) not implemented. Proper Cx of HVAC typically delivers 10–15% energy savings and earns up to 6 LEED points.'});
  if(ws.total<40) recs.push({sev:'critical',text:`WELL score ${ws.total}/100 is below Bronze (40 pts). Prioritize Air concept (A01–A05) and Thermal Comfort (T01–T04) — highest occupant impact and most achievable.`});
  if(ds<60) recs.push({sev:'warning',text:`Disaster resilience at ${ds}% is below adequate threshold (60%). Critical gaps in: ${DISASTER_DATA.filter((_,i)=>disCatScore(i).pct<50).map(d=>d.cat).join(', ')}.`});
  const critRisks=ST.risks.filter(r=>r.l*r.i>=17);
  if(critRisks.length) recs.push({sev:'critical',text:`${critRisks.length} critical risk(s) identified: "${critRisks.map(r=>r.desc).join('; ')}". Immediate mitigation required.`});
  if(carb.co2Intensity>27.5) recs.push({sev:'warning',text:`Carbon intensity ${carb.co2Intensity.toFixed(1)} kgCO2/m²/yr exceeds EU Taxonomy threshold (27.5). Gap: ${(carb.co2Intensity-27.5).toFixed(1)} kgCO2/m²/yr. Increase renewables and energy efficiency.`});
  if(!recs.length) recs.push({sev:'info',text:'Excellent performance across all sustainability metrics. Consider targeting LEED Platinum and WELL Platinum to maximize market differentiation.'});

  const certColor={PLATINUM:'#0FBF7A',GOLD:'#C8970F',SILVER:'#94A3B8',CERTIFIED:'#6DA87E','BELOW MIN':'#E84444',INELIGIBLE:'#E84444',BRONZE:'#cd7f32'};

  let h=`<div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">`;
  h+=`<div><h2 style="font-size:18px;margin-bottom:2px">Sustainability Intelligence Report</h2>
    <p style="font-size:10px;color:var(--muted)">${p.name} · ${p.city||''}${p.city?', ':''}${p.country} · ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</p></div>`;
  h+=`<button class="btn-primary" style="font-size:11px;padding:8px 16px;flex-shrink:0" onclick="genPDF()">
    <i class="fas fa-file-pdf" style="margin-right:6px"></i>Download PDF
  </button>`;
  h+=`</div>`;

  // Summary cards
  h+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px" class="grid4">`;
  [
    {l:'LEED v4.1',v:ls.total,max:110,cert:ls.cert,col:certColor[ls.cert]||'#E84444',icon:'fa-leaf'},
    {l:'WELL v2',v:ws.total,max:100,cert:ws.cert,col:certColor[ws.cert]||'#E84444',icon:'fa-heart-pulse'},
    {l:'Disaster Resilience',v:ds,max:100,cert:ds>=80?'Resilient':ds>=60?'Adequate':ds>=40?'Moderate':'Vulnerable',col:ds>=80?'#0FBF7A':ds>=60?'#C8970F':ds>=40?'#F97316':'#E84444',icon:'fa-shield-halved'},
    {l:'ESG Score',v:ESG_total,max:100,cert:ESG_total>=80?'Strong':ESG_total>=60?'Good':ESG_total>=40?'Developing':'Weak',col:ESG_total>=60?'#0FBF7A':'#C8970F',icon:'fa-chart-line'}
  ].forEach(c=>{
    h+=`<div class="kpi" style="text-align:center">
      <i class="fas ${c.icon}" style="color:${c.col};font-size:16px;margin-bottom:6px;display:block"></i>
      <div style="font-size:22px;font-weight:800;color:${c.col}">${c.v}</div>
      <div style="font-size:8px;color:var(--muted);margin-bottom:3px">/ ${c.max} · ${c.l}</div>
      <span class="cert" style="background:${c.col}20;color:${c.col}">${c.cert}</span>
    </div>`;
  });
  h+=`</div>`;

  // Carbon summary
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px" class="grid4">`;
  [{l:'Carbon Intensity',v:carb.co2Intensity.toFixed(1),u:'kgCO2/m²/yr',col:carb.co2Intensity>35?'var(--red)':'var(--em)'},{l:'Annual Emissions',v:(carb.opCO2/1000).toFixed(1),u:'tCO2e/yr',col:'var(--gold)'},{l:'Adjusted EUI',v:carb.adjEUI.toFixed(0),u:'kWh/m²/yr',col:'var(--cyan)'},{l:'Renewable Energy',v:carb.renPct,u:'%',col:'var(--em)'}].forEach(c=>{
    h+=`<div class="kpi"><div style="font-size:9px;color:var(--muted);margin-bottom:3px">${c.l}</div>
      <div style="font-size:18px;font-weight:800;color:${c.col}">${c.v}</div>
      <div style="font-size:8px;color:var(--muted)">${c.u}</div></div>`;
  });
  h+=`</div>`;

  // Recommendations
  h+=`<div class="glass" style="border-radius:12px;padding:14px;margin-bottom:14px">`;
  h+=`<h3 style="font-size:13px;margin-bottom:10px"><i class="fas fa-lightbulb" style="color:var(--gold);margin-right:6px"></i>Key Recommendations</h3>`;
  const sevCol={critical:'#E84444',warning:'#C8970F',info:'#3B82F6'};
  const sevIco={critical:'fa-circle-exclamation',warning:'fa-triangle-exclamation',info:'fa-circle-info'};
  recs.forEach((r,i)=>{
    h+=`<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border-radius:7px;background:rgba(9,20,9,.5);margin-bottom:5px;border-left:2px solid ${sevCol[r.sev]}">
      <i class="fas ${sevIco[r.sev]}" style="color:${sevCol[r.sev]};font-size:11px;margin-top:2px;flex-shrink:0"></i>
      <span style="font-size:9px;line-height:1.6">${r.text}</span>
    </div>`;
  });
  h+=`</div>`;

  // LEED breakdown
  h+=`<div class="glass" style="border-radius:12px;padding:14px;margin-bottom:14px">`;
  h+=`<h3 style="font-size:13px;margin-bottom:10px"><i class="fas fa-leaf" style="color:var(--em);margin-right:6px"></i>LEED Category Breakdown</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px" class="grid3">`;
  ls_cs.forEach(c=>{
    h+=`<div style="padding:8px;border-radius:8px;background:rgba(9,20,9,.5)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:9px;font-weight:700;font-family:sans-serif">${c.a}</span>
        <span style="font-size:9px;color:var(--em);font-weight:800">${c.p}/${c.m}</span>
      </div>
      <div style="font-size:8px;color:var(--muted);margin-bottom:3px">${c.c}</div>
      <div class="pbar"><div class="pfill" style="width:${c.m?Math.round(c.p/c.m*100):0}%;background:var(--em)"></div></div>
    </div>`;
  });
  h+=`</div></div>`;

  // WELL breakdown
  h+=`<div class="glass" style="border-radius:12px;padding:14px;margin-bottom:14px">`;
  h+=`<h3 style="font-size:13px;margin-bottom:10px"><i class="fas fa-heart-pulse" style="color:var(--rose);margin-right:6px"></i>WELL Concept Breakdown</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px">`;
  ws_cs.forEach(c=>{
    h+=`<div style="padding:7px;border-radius:8px;background:rgba(9,20,9,.5);text-align:center">
      <div style="font-size:8px;margin-bottom:3px">${c.c}</div>
      <div style="font-size:12px;font-weight:800;color:${c.cl}">${c.p}/${c.m}</div>
      <div class="pbar" style="margin-top:3px"><div class="pfill" style="width:${c.m?Math.round(c.p/c.m*100):0}%;background:${c.cl}"></div></div>
    </div>`;
  });
  h+=`</div></div>`;

  // Disaster breakdown
  h+=`<div class="glass" style="border-radius:12px;padding:14px;margin-bottom:14px">`;
  h+=`<h3 style="font-size:13px;margin-bottom:10px"><i class="fas fa-shield-halved" style="color:var(--blue);margin-right:6px"></i>Disaster Resilience Breakdown</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px" class="grid4">`;
  DISASTER_DATA.forEach((d,i)=>{
    const cs=disCatScore(i);
    h+=`<div style="padding:7px;border-radius:8px;background:rgba(9,20,9,.5)">
      <div style="font-size:9px;font-weight:700;margin-bottom:2px"><i class="fas ${d.icon}" style="color:${d.color};margin-right:3px;font-size:8px"></i>${d.cat}</div>
      <div style="font-size:12px;font-weight:800;color:${d.color}">${cs.pct}%</div>
      <div style="font-size:8px;color:var(--muted)">${cs.yes}/${cs.total} met</div>
      <div class="pbar" style="margin-top:3px"><div class="pfill" style="width:${cs.pct}%;background:${d.color}"></div></div>
    </div>`;
  });
  h+=`</div></div>`;

  h+=`<div style="display:flex;justify-content:space-between;margin-top:8px">`;
  h+=`<button class="btn-ghost" onclick="goStep(6)"><i class="fas fa-arrow-left" style="margin-right:5px"></i>Back</button>`;
  h+=`<button class="btn-primary" onclick="genPDF()"><i class="fas fa-file-pdf" style="margin-right:6px"></i>Download Full PDF Report</button>`;
  h+=`</div></div>`;
  el('appWrap').innerHTML=h;
}

/* ═══════════════════════════════════════════════════
   SPLASH + INIT
   ═══════════════════════════════════════════════════ */
function initSplash(){
  const cv=el('splashCanvas'), ctx=cv.getContext('2d');
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  const pts=[];
  for(let i=0;i<70;i++) pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.5+.4,a:Math.random()*.35+.08});
  let frame=0;
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='rgba(15,191,122,0.035)'; ctx.lineWidth=.5;
    for(let x=0;x<cv.width;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
    for(let y=0;y<cv.height;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=cv.width; if(p.x>cv.width)p.x=0;
      if(p.y<0)p.y=cv.height; if(p.y>cv.height)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(.4,p.r),0,Math.PI*2);
      ctx.fillStyle=`rgba(15,191,122,${p.a})`; ctx.fill();
    });
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<90){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(15,191,122,${.05*(1-d/90)})`;ctx.lineWidth=.5;ctx.stroke()}
    }
    frame++;
    if(frame<200) requestAnimationFrame(loop);
  }
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches) loop();
  setTimeout(()=>{
    el('splash').classList.add('hide');
    setTimeout(()=>{
      el('splash').style.display='none';
      el('stepBar').style.display='block';
      el('appWrap').style.display='block';
      drawStepper(); render();
    },800);
  },2800);
}

document.addEventListener('DOMContentLoaded',()=>{
  el('rAddBtn').addEventListener('click',()=>{
    const desc=el('rDesc').value.trim();
    if(!desc){toast('Enter a risk description','warning');return}
    ST.risks.push({
      desc,
      l:parseInt(el('rL').value),
      i:parseInt(el('rI').value),
      cat:el('rCat').value,
      treat:el('rTreat').value
    });
    el('rDesc').value='';
    el('riskModal').classList.remove('show');
    if(ST.step===5) rRisk();
    toast('Risk added to register','success');
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') el('riskModal').classList.remove('show') });
  initSplash();
});
