ith higher temperature amplitude, gravel bed wadis, and sudden flash flood risks.",soilRecommendation:"Rocky / hard gravel soils. Highly challenging for excavation. Foundations require anchoring; landscaping thrives in microclimatic wadi-bed soils.",greenDesignHint:"Integrate localized stone-masonry gabion structures to harvest flash wadi run-offs, leverage passive mountain-wind drafting, and specify local stone cladding."},{id:"eu-central-oceanic",location:"Europe",name:"Central European Oceanic Zone (Frankfurt, Paris, Brussels)",description:"Temperate, mildly humid maritime air masses. Moderate summers and cool, wet winters. Consistent annual rain patterns. Main building target is winter heat preservation and passive solar gain.",soilRecommendation:"Loamy and Silty soils are predominant. Highly fertile but requires excellent foundation drainage configurations to avoid damp cellar walls.",greenDesignHint:"Prioritize double-skin facades with thermal glass partitions (low-E coatings, Argon gaps), heat recovery ventilation (HRV >= 85%), and rain harvesting."},{id:"eu-mediterranean",location:"Europe",name:"Southern Euro-Mediterranean Zone (Athens, Rome, Madrid)",description:"Subtropical hot, dry summers paired with mild, wet winters. High solar irradiance index in summers, requiring thermal mass and solar shading controls.",soilRecommendation:"Silty clay loam and Rocky soils. Stony top layers offer high stability; incorporate deep drought-resilient vegetation grids to guard against slope erosions.",greenDesignHint:"Utilize high-albedo clay tile roofing, deep cantilevered balconies, natural cross-ventilation, and greywater recycling for endemic xeriscapes."},{id:"eu-boreal-cold",location:"Europe",name:"Northern Boreal & Baltic Zone (Stockholm, Oslo, Helsinki)",description:"Subarctic continental climate with freezing, dark, snowy winters and brief, mild summers. Heating energy optimization is the primary operational concern.",soilRecommendation:"Rocky bedrock or spongy Peaty soil pockets. Bedrock offers immense load support, but peaty spaces demand deep helical anchoring or complete sand swap backfills.",greenDesignHint:"Use triple-glazed gas-filled wooden window profiles, high-thickness exterior timber insulation (R-values >= 40), and mechanical heat pumps coupled with geothermal storage."},{id:"sg-equatorial-island",location:"Singapore",name:"Equatorial Rainforest / Garden City (Singapore Mainland)",description:"Constant high temperatures and intense relative humidity year-round. Zero cold season. Abundant precipitation with two distinct tropical monsoon wind streams.",soilRecommendation:"Clayey and Silty latosol soils. Dense structures that require deep pile structural basements; requires immediate run-off retention to avoid soil siltation.",greenDesignHint:"Optimize structural shading via vertical green screens and biophilic sky terraces (LEED dynamic cooling effect), collect rainwater for dual flushing, and run high-efficiency smart indoor water chillers."}],Lh=`
  self.onmessage = function(e) {
    const { fileText, fileName } = e.data;
    if (!fileText) {
      self.postMessage({ error: "Empty file content" });
      return;
    }
    
    const lines = fileText.split('\\n');
    const totalLines = lines.length;
    
    let wallCount = 0;
    let slabCount = 0;
    let windowCount = 0;
    let doorCount = 0;
    let columnCount = 0;
    let beamCount = 0;
    let storeyCount = 0;
    
    // Extract name from file or inside entities
    let projectName = fileName ? fileName.replace(/\\.ifc$/i, "").replace(/[-_]/g, " ") : "BIM Asset";
    // Proper capitalization for design aesthetics
    projectName = projectName.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    
    let organizationName = "BIM Integrated Client";
    
    let latitude = null;
    let longitude = null;
    
    // Single sweeping pass for speed
    const batchSize = Math.max(100, Math.floor(totalLines / 100));
    for (let i = 0; i < totalLines; i++) {
      const line = lines[i];
      if (!line) continue;
      
      const upperLine = line.toUpperCase();
      
      if (upperLine.includes("IFCWALL")) {
        wallCount++;
      } else if (upperLine.includes("IFCSLAB")) {
        slabCount++;
      } else if (upperLine.includes("IFCWINDOW")) {
        windowCount++;
      } else if (upperLine.includes("IFCDOOR")) {
        doorCount++;
      } else if (upperLine.includes("IFCCOLUMN")) {
        columnCount++;
      } else if (upperLine.includes("IFCBEAM")) {
        beamCount++;
      } else if (upperLine.includes("IFCBUILDINGSTOREY")) {
        storeyCount++;
      }
      
      // Extract structural name labels
      if (upperLine.includes("IFCPROJECT") || upperLine.includes("IFCBUILDING(")) {
        const matches = line.match(/'([^']+)'/g);
        if (matches && matches.length > 0) {
          let namePart = matches[0].replace(/'/g, "").trim();
          if (namePart.length === 22 && matches.length > 1) {
            const nextMatch = matches[1].replace(/'/g, "").trim();
            if (nextMatch && nextMatch.length > 1) {
              namePart = nextMatch;
            }
          }
          if (namePart && namePart.length > 3 && namePart !== "Project" && namePart !== "Default Project" && namePart.length !== 22) {
            projectName = namePart;
          }
          if (matches.length > 1) {
            const orgPart = matches[1].replace(/'/g, "").trim();
            if (orgPart && orgPart.length > 3 && orgPart.length !== 22) {
              organizationName = orgPart;
            }
          }
        }
      }
      
      // Geolocation degree coordinates
      if (upperLine.includes("IFCSITE")) {
        const latLonMatches = line.match(/\\(\\s*(-?\\d+)\\s*,\\s*(-?\\d+)\\s*,\\s*(-?\\d+)\\s*,\\s*(-?\\d+)\\s*\\)/g);
        if (latLonMatches && latLonMatches.length >= 2) {
          try {
            const parseDMS = (dmsStr) => {
              const clean = dmsStr.replace(/[()\\s]/g, "");
              const parts = clean.split(",");
              if (parts.length >= 3) {
                const d = parseFloat(parts[0]) || 0;
                const m = parseFloat(parts[1]) || 0;
                const s = parseFloat(parts[2]) || 0;
                const micro = parseFloat(parts[3] || 0) / 1000000;
                const sign = d < 0 ? -1 : 1;
                return d + sign * (m / 60 + (s + micro) / 3600);
              }
              return null;
            };
            const latVal = parseDMS(latLonMatches[0]);
            const lonVal = parseDMS(latLonMatches[1]);
            
            if (latVal !== null && lonVal !== null && Math.abs(latVal) <= 90 && Math.abs(lonVal) <= 180) {
              latitude = latVal;
              longitude = lonVal;
            }
          } catch(err) {}
        } else {
          // Regular decimal fallback within local spaces
          const decMatch = line.match(/(-?\\d+\\.\\d+)\\s*,\\s*(-?\\d+\\.\\d+)/);
          if (decMatch && decMatch.length >= 3) {
            latitude = parseFloat(decMatch[1]);
            longitude = parseFloat(decMatch[2]);
          }
        }
      }
      
      if (i % batchSize === 0) {
        self.postMessage({
          progress: Math.floor((i / totalLines) * 100),
          status: "scanning"
        });
      }
    }
    
    // Structural sizing heuristics (BIM calculations matching real engineering models)
    const storeys = Math.max(1, storeyCount);
    const elementsSlabCount = Math.max(1, slabCount);
    const elementsWallCount = Math.max(1, wallCount);
    
    // Average floor size = slabs * 125 sqm
    const totalSizeSqm = Math.max(140, elementsSlabCount * 135);
    const numFloors = storeys;
    
    // Auto coordinate deduction if not found based on model name tags
    if (latitude === null || longitude === null) {
      const lowerName = projectName.toLowerCase() + " " + fileName.toLowerCase();

            th { background: #0f766e; color: #ffffff; padding: 8px 10px; text-align: left; font-size: 9.5px; text-transform: uppercase; font-weight: bold; }
            td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; font-size: 10px; vertical-align: top; }
            tr:nth-child(even) td { background: #f8fafc; }
            .carbon-sum { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 12px; border-radius: 8px; color: #064e3b; font-size: 11px; line-height: 1.5; }
            .btn-print { background: #0f766e; color: #ffffff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; margin-bottom: 20px; }
            @media print {
              .btn-print { display: none; }
              body { padding: 0px; }
            }
          </style>
        </head>
        <body>
          <button onclick="window.print()" class="btn-print">Print / Save as PDF</button>

          <div class="header-banner">
            <div>
              <h1>ARC GREEN ASSESSMENT REPORT</h1>
              <p>Green Design Intelligence Platform for UAE & India operations • LEED-compliant</p>
            </div>
            <div style="text-align: right">
              <span style="font-weight: bold; font-family: monospace">REPORT ID: ARC-${Date.now().toString().slice(-6)}</span>
              <p>Issued: ${new Date().toLocaleDateString()}</p>
            </div>
          </div>

          <div class="meta-grid">
            <div class="meta-card">
              <div class="meta-label">Project Name</div>
              <div class="meta-value">${r.name}</div>
            </div>
            <div class="meta-card">
              <div class="meta-label">Organization</div>
              <div class="meta-value">${r.organization}</div>
            </div>
            <div class="meta-card">
              <div class="meta-label">Location Territory</div>
              <div class="meta-value">${r.location} • ${V?V.name:"Climate Zone"}</div>
            </div>
            <div class="meta-card">
              <div class="meta-label">Structure Type</div>
              <div class="meta-value">${r.constructionMode}</div>
            </div>
          </div>

          <div class="cert-box">
            <div class="cert-details">
              <h2>Zoning Certification Outcome</h2>
              <h3>LEED-Aligned Compliance Blueprint</h3>
              <p>This automated audit certifies that structural carbon footprint reductions and setback landscaping comply with sustainable zoning regulations.</p>
            </div>
            <div class="cert-badge">
              <div class="cert-score">${A.overallScore}</div>
              <div class="cert-tier">${A.ratingTier}</div>
            </div>
          </div>

          \x3C!-- Comparative Before vs After Scoreboard Graph -->
          <div class="section-title">Baseline vs. Re-engineered Green Score Comparison</div>
          <div style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 18px; margin-bottom: 25px">
            <p style="font-size: 10px; color: #475569; margin-bottom: 12px; line-height: 1.4">
              This comparative visual documents the building performance leaps from standard red clay conventions and unmanaged yards (Before specs) to the optimized low-carbon substitutes and biophilic setback structures (Proposed specs).
            </p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px">
              \x3C!-- LEED Comparison -->
              <div style="background:#ffffff; padding:12px 14px; border-radius:8px; border:1px solid #e2e8f0">
                <h4 style="font-size: 10.5px; text-transform: uppercase; color:#0f766e; font-weight:bold; margin-bottom:10px">LEED v4.1 Certification Lift</h4>
                <div style="margin-bottom:12px">
                  <div style="display:flex; justify-content:space-between; margin-bottom:3px; font-size:9px; color:#475569">
                    <span>Conventional Baseline Scope:</span>
                    <strong>${C.overallScore} / 110 Pts (${C.ratingTier})</strong>
                  </div>
                  <div style="height:8px; border-radius:4px; border:1px solid #cbd5e1; background:#f1f5f9; overflow:hidden">
                    <div style="height:100%; background:#94a3b8; width:${C.overallScore/110*100}%"></div>
                  </div>
                </div>
                <div>
                  <div style="display:flex; justify-content:space-between; margin-bottom:3px; font-size:9.5px; color:#0f766e">
                    <strong>ARC Low-Carbon Layout Suggestion:</strong>
                    <strong>${A.overallScore} / 110 Pts (${A.ratingTier})</strong>
                  </div>
                  <div style="height:12px; border-radius:6px; border:1px solid #86efac; background:#f0fdf4; overflow:hidden">
                    <div style="height:100%; background:#059669; width:${A.overallScore/110*100}%"></div>
                  </div>
                </div>
              </div>

              \x3C!-- WELL Comparison -->
              <div style="background:#ffffff; padding:12px 14px; border-radius:8px; border:1px solid #e2e8f0">
                <h4 style="font-size: 10.5px; text-transform: uppercase; color:#be123c; font-weight:bold; margin-bottom:10px">WELL™ Occupant Health Index</h4>
                <div style="margin-bottom:12px">
                  <div style="display:flex; justify-content:space-between; margin-bottom:3px; font-size:9px; color:#475569">
                    <span>Baseline standard:</span>
                    <strong>${z.overallScore} / 100 Pts (${z.ratingTier})</strong>
                  </div>
                  <div style="height:8px; border-radius:4px; border:1px solid #cbd5e1; background:#f1f5f9; overflow:hidden">
                    <div style="height:100%; background:#94a3b8; width:${z.overallScore/100*100}%"></div>
                  </div>
                </div>
                <div>
                  <div style="display:flex; justify-content:space-between; margin-bottom:3px; font-size:9.5px; color:#be123c">
                    <strong>ARC Low-Carbon Layout Suggestion:</strong>
                    <strong>${x.overallScore} / 100 Pts (${x.ratingTier})</strong>
                  </div>
                  <div style="height:12px; border-radius:6px; border:1px solid #fecdd3; background:#fff5f5; overflow:hidden">
                    <div style="height:100%; background:#e11d48; width:${x.overallScore/100*100}%"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <div class="section-title">LEED Points Breakdown</div>
              <div class="score-row">
                <div class="score-label">Materials & Resources</div>
                <div class="score-bar"><div class="score-fill" style="width: ${A.categories.materialsAndResources.score/A.categories.materialsAndResources.maxScore*100}%"></div></div>
                <div class="score-val">${A.categories.materialsAndResources.score} / ${A.categories.materialsAndResources.maxScore}</div>
              </div>
              <div class="score-row">
                <div class="score-label">Sustainable Sites</div>
                <div class="score-bar"><div class="score-fill" style="width: ${A.categories.sustainableSites.score/A.categories.sustainableSites.maxScore*100}%"></div></div>
                <div class="score-val">${A.categories.sustainableSites.score} / ${A.categories.sustainableSites.maxScore}</div>
              </div>
              <div class="score-row">
                <div class="score-label">Water Efficiency</div>
                <div class="score-bar"><div class="score-fill" style="width: ${A.categories.waterEfficiency.score/A.categories.waterEfficiency.maxScore*100}%"></div></div>
                <div class="score-val">${A.categories.waterEfficiency.score} / ${A.categories.waterEfficiency.maxScore}</div>
              </div>
              <div class="score-row">
                <div class="score-label">Energy & Atmosphere</div>
                <div class="score-bar"><div class="score-fill" style="width: ${A.categories.energyAndAtmosphere?A.categories.energyAndAtmosphere.score/35*100:0}%"></div></div>
                <div class="score-val">${A.categories.energyAndAtmosphere?A.categories.energyAndAtmosphere.score:0} / 35</div>
              </div>
              <div class="score-row">
                <div class="score-label">Innovation</div>
                <div class="score-bar"><div class="score-fill" style="width: ${A.categories.innovation.score/A.categories.innovation.maxScore*100}%"></div></div>
                <div class="score-val">${A.categories.innovation.score} / ${A.categories.innovation.maxScore}</div>
              </div>
            </div>

            <div>
              <div class="section-title">Embodied Carbon Performance</div>
              <div style="margin-bottom: 12px; font-size:10.5px">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px">
                  <span>Conventional Material Baseline:</span>
                  <strong>${(R.totalConventionalCO2/1e3).toFixed(1)} tons CO₂e</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                  <span>ARC Optimized Material Level:</span>
                  <strong style="color: #059669">${(R.totalOptimizedCO2/1e3).toFixed(1)} tons CO₂e</strong>
                </div>
              </div>
              <div class="carbon-sum">
                <strong>Savings Summary:</strong><br/>
                Embodied Carbon savings achieved: <strong>${R.savingPercentage.toFixed(1)}%</strong> reduction. <br/>
                Total greenhouse gas emissions abated: <strong>${(R.totalSavedCO2/1e3).toFixed(1)} tons of CO₂ equivalent</strong>.
              </div>
            </div>
          </div>

          \x3C!-- DIGITAL TWIN SIMULATION REPORT SECTIONS -->
          <div class="section-title">Digital Twin 12-Month Energy Simulator Summary</div>
          <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:18px; margin-bottom:25px">
            <p style="font-size:9.5px; color:#475569; margin-bottom:15px; line-height:1.4">
              Building dynamic thermodynamic simulation executing under the ASHRAE Heat Balance Method, using live historical climate archives for <strong>${r.location}</strong>. Managed at a constant 23°C comfort boundary.
            </p>

            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-bottom:18px">
              <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8.5px; padding:10px 12px; text-align:center">
                <span style="font-size:7.5px; text-transform:uppercase; color:#64748b; font-family:monospace; font-weight:bold; display:block">Projected Energy Usage</span>
                <div style="font-size:14px; font-weight:800; color:#0f766e; margin-top:4px">${(Ee.annual.totalEnergy/1e3).toFixed(1)} MWh</div>
                <span style="font-size:7.5px; color:#94a3b8; display:block; margin-top:2px">per annum scale</span>
              </div>
              <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8.5px; padding:10px 12px; text-align:center">
                <span style="font-size:7.5px; text-transform:uppercase; color:#64748b; font-family:monospace; font-weight:bold; display:block">Operational Carbon</span>
                <div style="font-size:14px; font-weight:800; color:#ea580c; margin-top:4px">${Ee.operationalCarbon_tCO2e} t CO₂e</div>
                <span style="font-size:7.5px; color:#94a3b8; display:block; margin-top:2px">per annum output</span>
              </div>
              <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8.5px; padding:10px 12px; text-align:center">
                <span style="font-size:7.5px; text-transform:uppercase; color:#64748b; font-family:monospace; font-weight:bold; display:block">Utility Overheads</span>
                <div style="font-size:14px; font-weight:800; color:#16a34a; margin-top:4px">${L} ${Ee.annualCost_AED.toLocaleString()}</div>
                <span style="font-size:7.5px; color:#94a3b8; display:block; margin-top:2px">estimated tariff rate</span>
              </div>
              <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8.5px; padding:10px 12px; text-align:center">
                <span style="font-size:7.5px; text-transform:uppercase; color:#64748b; font-family:monospace; font-weight:bold; display:block">Peak Month Demand</span>
                <div style="font-size:14px; font-weight:800; color:#dc2626; margin-top:4px">${Ee.peakMonth.month}</div>
                <span style="font-size:7.5px; color:#dc2626; font-weight:bold; display:block; margin-top:2px">${Ee.peakMonth.totalEnergy_kWh.toLocaleString()} kWh</span>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1.2fr 1.8fr; gap:18px">
              
              \x3C!-- Stacked Vector Chart -->
              <div style="background:#0f172a; padding:12px; border-radius:8px; border:1px solid #020617; text-align:center">
                <span style="font-size:8px; font-family:monospace; color:#94a3b8; text-transform:uppercase; display:block; margin-bottom:8px">12-Month Simulated Load Profile (kWh)</span>
                ${dt(pe)}
                <div style="display:flex; justify-content:center; gap:10px; font-size:7px; font-family:monospace; color:#cbd5e1; margin-top:8px">
                  <span><span style="display:inline-block; width:6px; height:6px; background:#10b981; margin-right:2px"></span>Cooling</span>
                  <span><span style="display:inline-block; width:6px; height:6px; background:#f59e0b; margin-right:2px"></span>Heating</span>
                  <span><span style="display:inline-block; width:6px; height:6px; background:#3b82f6; margin-right:2px"></span>Base Loads</span>
                </div>
              </div>

              \x3C!-- Monthly spreadsheet table -->
              <table style="margin:0; width:100%">
                <thead>
                  <tr style="background:#1e293b">
                    <th style="padding:4px 6px; font-size:8.5px">Month</th>
                    <th style="padding:4px 6px; font-size:8.5px; text-align:right">Cooling (kWh)</th>
                    <th style="padding:4px 6px; font-size:8.5px; text-align:right">Heating (kWh)</th>
                    <th style="padding:4px 6px; font-size:8.5px; text-align:right">Base/Water (kWh)</th>
                    <th style="padding:4px 6px; font-size:8.5px; text-align:right; font-weight:bold">Total Load</th>
                  </tr>
                </thead>
                <tbody>
                  ${pe.map(Q=>`
                    <tr>
                      <td style="padding:4px 6px; font-size:8.5px"><strong>${Q.month}</strong></td>
                      <td style="padding:4px 6px; font-size:8.5px; text-align:right; color:#047857">${Q.coolingEnergy_kWh.toLocaleString()}</td>
                      <td style="padding:4px 6px; font-size:8.5px; text-align:right; color:#b45309">${Q.heatingEnergy_kWh.toLocaleString()}</td>
                      <td style="padding:4px 6px; font-size:8.5px; text-align:right; color:#1d4ed8">${((Q.lightingEnergy_kWh||0)+(Q.hwEnergy_kWh||0)).toLocaleString()}</td>
                      <td style="padding:4px 6px; font-size:8.5px; text-align:right; font-weight:bold">${Q.totalEnergy_kWh.toLocaleString()}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>

            </div>
          </div>

          \x3C!-- Scenario Comparison table in Printable report -->
          <div class="section-title">Envelope Refinement & Payback Simulation Analysis</div>
          <table style="margin-top:5px; margin-bottom:25px">
            <thead>
              <tr style="background:#0f766e">
                <th style="font-size:9px">Retrofit Upgrade Specification</th>
                <th style="text-align:right; font-size:9px">Simulated Load Reduction</th>
                <th style="text-align:right; font-size:9px">Annual Cost Saved</th>
                <th style="text-align:right; font-size:9px">CO2 Abated</th>
                <th style="text-align:right; font-size:9px">Payback Period</th>
                <th style="text-align:right; font-size:9px">LEED points</th>
              </tr>
            </thead>
            <tbody>
              ${ue.scenarios.map(Q=>`
                <tr style="background:${Q.name.includes("Envelope")||Q.name.includes("Package")?"#f0fdf4":"inherit"}">
                  <td>
                    <strong style="color:#0f172a">${Q.name}</strong><br/>
                    <span style="font-size:8px; color:#64748b">${Q.description}</span>
                  </td>
                  <td style="text-align:right; font-weight:bold; color:#059669">-${Q.savings.energy_percent}%</td>
                  <td style="text-align:right; font-weight:bold">${L} ${Q.savings.cost_AED.toLocaleString()}</td>
                  <td style="text-align:right">${Q.savings.carbon_tCO2e} t</td>
                  <td style="text-align:right; font-weight:bold">${Q.economics.paybackYears?`${Q.economics.paybackYears} yrs`:"—"}</td>
                  <td style="text-align:right; font-weight:bold; color:#0f766e">+${Q.leedPoints} pts</td>
                </tr>
              `).join("")}
            </tbody>
          </table>

          \x3C!-- WELL Building Standard Health Rating Section -->
          <div class="section-title">WELL Building Standard™ Occupant Health Index</div>
          <div style="display:grid; grid-template-columns: 2fr 3.2fr; gap:20px; margin-bottom:25px; background: #fff1f2; border: 1px solid #fecdd3; padding: 16px; border-radius: 12px">
            <div>
              <h3 style="font-size: 11px; font-weight: 800; color: #9f1239; text-transform: uppercase; margin-bottom: 4px">Occupant Well-being Certificate</h3>
              <div style="display: inline-block; background: #e11d48; color: white; font-weight: bold; font-family: monospace; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; letter-spacing: 0.5px">
                WELL ${x.ratingTier.toUpperCase()} CERTIFIED
              </div>
              <p style="font-size: 10.5px; color: #4c0519; line-height: 1.5; margin-top: 5px">
                <strong>Dynamic Climatic Advice:</strong> ${x.zoneAdvisory}<br/>
                <strong style="display:block; margin-top: 4px">Physical Mobility Index:</strong> ${x.amenityStrength}
              </p>
            </div>
            <div>
              <h4 style="font-size: 8.5px; font-weight: bold; text-transform: uppercase; color: #be123c; margin-bottom: 8px; border-bottom: 1px dashed rgba(225, 29, 72, 0.2); padding-bottom: 3px">
                Category score distribution (Overall Score: ${x.overallScore}/100)
              </h4>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 9.5px">
                ${x.breakdown.map(Q=>`
                  <div style="background: rgba(255,255,255,0.7); padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(225, 29, 72, 0.15)">
                     <strong style="color: #9f1239; display:block; font-size: 9px; line-height:1.2">${Q.category}</strong>
                     <span style="color: #475569; font-size: 8.5px; display:block; margin: 2px 0">${Q.dropdownSelected}</span>
                     <span style="font-weight:bold; color: #e11d48; font-size: 9px">${Q.points} / ${Q.maxPoints} pts</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          \x3C!-- BIM Section in Printable Report -->
          <div class="section-title">BIM 3D Model Specifications & Structural Wireframe</div>
          <div style="display:grid; grid-template-columns: 1fr 1.8fr; gap:20px; margin-bottom:25px; border:1px solid #cbd5e1; border-radius:12px; padding:15px; background:#f8fafc">
            \x3C!-- Left: Wireframe vector -->
            <div style="background:#ffffff; border:1px solid #cbd5e1; padding:10px; border-radius:8px; text-align:center">
              ${Km(r,!0)}
              <span style="font-size:8px; font-family:monospace; color:#0f766e; display:block; margin-top:5px">EXTRACTED Wireframe Projection</span>
            </div>
            
            \x3C!-- Right: Elements data -->
            <div style="display:flex; flex-direction:column; justify-content:center">
              <h3 style="font-size:11px; font-weight:bold; text-transform:uppercase; color:#0f172a; margin-top:0; margin-bottom:10px">IFC File Parsing Details</h3>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:10px; margin-bottom:10px">
                <div style="background:#ffffff; border:1px solid #e2e8f0; padding:6px 10px; border-radius:6px">
                  <span style="font-size:8px; color:#64748b; text-transform:uppercase; font-family:monospace">Source Model:</span>
                  <div style="font-weight:bold; color:#0f172a; overflow:hidden; text-overflow:ellipsis">${r.bimFileName||"Generic Model Mockup"}</div>
                </div>
                <div style="background:#ffffff; border:1px solid #e2e8f0; padding:6px 10px; border-radius:6px">
                  <span style="font-size:8px; color:#64748b; text-transform:uppercase; font-family:monospace">Story Levels:</span>
                  <div style="font-weight:bold; color:#0f172a">${r.numFloors} Levels</div>
                </div>
                <div style="background:#ffffff; border:1px solid #e2e8f0; padding:6px 10px; border-radius:6px">
                  <span style="font-size:8px; color:#64748b; text-transform:uppercase; font-family:monospace">Concrete Volume:</span>
                  <div style="font-weight:bold; color:#0f172a">${(((ut=y.find(Q=>Q.conventionalId==="conv-opc-concrete"))==null?void 0:ut.quantity)||r.totalSizeSqm*.15).toFixed(0)} m³</div>
                </div>
                <div style="background:#ffffff; border:1px solid #e2e8f0; padding:6px 10px; border-radius:6px">
                  <span style="font-size:8px; color:#64748b; text-transform:uppercase; font-family:monospace">Total Size:</span>
                  <div style="font-weight:bold; color:#0f172a">${r.totalSizeSqm} Sqm</div>
                </div>
              </div>
              
              <div style="background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; padding:10px; font-size:9.5px; color:#064e3b; line-height:1.4">
                <strong>BIM-Integrated Synchronization:</strong> Mapped <strong>${r.bimWallCount||16} walls</strong>, <strong>${r.bimColumnCount||12} columns</strong>, and <strong>${r.bimWindowCount||10} window apertures</strong>. Synchronizing physical structures directly with LEED Materials MR criteria. Built using digital twin validation protocols.
              </div>
            </div>
          </div>

          <div class="section-title">Substituted Material Specifications</div>
          <table>
            <thead>
              <tr>
                <th style="width:45px; text-align:center">Row</th>
                <th>Selected Conventional Material</th>
                <th>Specific Application Purpose</th>
                <th>ARC Low-Carbon Alternative</th>
                <th>Quantity</th>
                <th style="text-align:right">Carbon Savings</th>
              </tr>
            </thead>
            <tbody>
              ${_}
            </tbody>
          </table>

          <div class="grid-2">
            <div>
              <div class="section-title">Boundary Setback Offsets</div>
              <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:15px; line-height: 1.8; font-size:10.5px">
                <div>• Front offset (to roadway): <strong>${r.frontOffset} meters</strong></div>
                <div>• Left offset: <strong>${r.sideOffsetLeft} meters</strong></div>
                <div>• Right offset: <strong>${r.sideOffsetRight} meters</strong></div>
                <div>• Back offset: <strong>${r.backOffset} meters</strong></div>
                <div style="margin-top:10px; color:#64748b; font-size:9.5px; border-top: 1px solid #e2e8f0; padding-top:6px">
                  Soil type on site: <strong>${r.soilType}</strong>
                </div>
              </div>
            </div>

            <div>
              <div class="section-title">Enrolled Energy Pledges</div>
              <div style="background:#f0fdfa; border:1px solid #99f6e4; border-radius:8px; padding:15px; font-size:10px; color:#0f766e; max-height: 154px; overflow: hidden">
                ${w||"<span style='color:#94a3b8; font-style:italic'>No active energy conservation strategies selected in this revision.</span>"}
              </div>
            </div>
          </div>

          <div style="margin-top:25px; display:grid; grid-template-columns:1fr 1fr; gap:15px">
